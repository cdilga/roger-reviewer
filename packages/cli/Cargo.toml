[package]
name = "roger-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rr"
path = "src/main.rs"

[features]
# Opt-in passthrough that compiles the real FastEmbed semantic embedder into the
# shipped binary. Off by default for 0.2 so the default cross-platform build
# stays lean and the lexical canonical-DB scan remains the always-on fallback;
# build with `--features semantic-fastembed` plus `rr assets install` to go
# fully semantic.
default = []
semantic-fastembed = ["roger-storage/semantic-fastembed"]

[dependencies]
roger-app-core = { path = "../app-core" }
roger-bridge = { path = "../bridge" }
roger-config = { path = "../config" }
roger-github-adapter = { path = "../github-adapter" }
roger-session-claude = { path = "../session-claude" }
roger-session-copilot = { path = "../session-copilot" }
roger-session-codex = { path = "../session-codex" }
roger-session-gemini = { path = "../session-gemini" }
roger-session-opencode = { path = "../session-opencode" }
roger-storage = { path = "../storage" }
roger-tui = { path = "../tui" }
base64.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toon-format = { version = "0.4.5", default-features = false }

[dev-dependencies]
tempfile.workspace = true
roger-validation = { path = "../validation" }
